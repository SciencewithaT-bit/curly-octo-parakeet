  ${so.photoIds?.length ? `<section class="sec"><div class="sec-head"><h2 class="sec-title">Photos</h2></div>${photoGrid(so.photoIds, false)}</section>` : ''}
  <section class="sec"><div class="sec-head"><h2 class="sec-title">Conditions</h2></div><div class="lines">
    <div class="kv"><span>Observé</span><span>${wxBits.length ? esc(wxBits.join(', ')) : '<span class="faint">rien noté</span>'}${so.meteo?.text ? `<br><span class="muted">${esc(so.meteo.text)}</span>` : ''}</span></div>
    <div class="kv"><span>Pluie 10 j</span><span class="mono">${so.wx ? `${nf.format(so.wx.mm)} mm · Open-Meteo` : '<span class="faint">en attente de réseau</span>'}</span></div>
    ${hasPos(so) ? `<div class="kv"><span>Position</span><span class="mono">${esc(fmtCoords(so))}${so.acc ? ` · ±${Math.round(so.acc)} m` : ''}</span></div>` : ''}</div></section>
  ${so.notes ? `<section class="sec"><div class="sec-head"><h2 class="sec-title">Notes</h2></div><p style="margin:0;font-size:15px;line-height:1.5;white-space:pre-wrap">${esc(so.notes)}</p></section>` : ''}`;
  return { html, mount: checkRibbons };
};

/* ----- Fiche d'observation complète ----- */
VIEWS.obs = ({ sid, i }) => {
  const so = S.sorties.find(s => s.id === sid); const idx = Number(i);
  if (!so || !so.obs?.[idx]) return VIEWS.carnet();
  if (!S.draft || S.draft.kind !== 'obs' || S.draft.sid !== sid || S.draft.i !== idx) {
    S.draft = { kind: 'obs', sid, i: idx, o: { methodes: [], substrat: [], stade: [], photos: {}, ...structuredClone(so.obs[idx]) } };
  }
  const o = S.draft.o; const c = completeness(o); const t = taxonOf(o); const spot = spotById(so.spotId);
  const row = (label, inner, id) => `<div class="fgrid">${id ? `<label class="label" for="${id}">${label}</label>` : `<span class="label">${label}</span>`}<div>${inner}</div></div>`;
  const inp = (path, ph, cls = '', id = '', extra = '') => `<input class="in ${cls}" ${id ? `id="${id}"` : ''} data-bind="o.${path}" value="${esc(getPath(S.draft.o, path) ?? '')}" placeholder="${esc(ph)}" autocomplete="off" ${extra}>`;
  const html = `${topbar(`Fiche · ${fmtDots(so.date)}`, `<span class="mono" style="font-size:12px;font-weight:600;width:44px;text-align:center;${c.full ? 'color:var(--tape)' : ''}">${c.pct} %</span>`)}
  ${speciesDatalist()}<datalist id="hotes">${HOTES.map(h => `<option value="${h}">`).join('')}</datalist><datalist id="odeurs">${ODEURS.map(h => `<option value="${h}">`).join('')}</datalist>
  <div style="display:flex;flex-direction:column;gap:6px;padding-top:2px">
    <span class="kicker">${t ? `N° ${num3(t.n)} · ` : ''}${esc(spot?.name || 'spot supprimé')}</span>
    ${inp('latin', 'Nom latin', 'la', 'o-la', 'style="font-size:22px;font-weight:700;min-height:52px" aria-label="Nom latin"')}
    ${inp('species', 'Nom français', '', 'o-fr', 'list="species-list" aria-label="Nom français"')}
    <div class="row"><div class="gauge grow ${c.full ? 'full' : ''}"><i style="width:${c.pct}%"></i></div>${c.full ? '<span class="ribbon">relevé complet</span>' : `<span class="mono" style="font-size:11px;color:var(--ink-2)">manque ${c.miss.length}</span>`}</div>
  </div>
  <section class="sec"><div class="sec-head"><h2 class="sec-title">Cinq plans</h2><span class="sec-meta">${PLANS.filter(([k]) => o.photos?.[k]).length} / 5</span></div>
    <div class="plans">${PLANS.map(([k, l]) => { const p = o.photos?.[k]; return `<label class="plan ${p ? '' : 'empty'}"><span class="ph">${p ? `<img data-photo="${p}" alt="${l}">` : shroom('none', 'none', 'var(--ink-3)', '3 3', 'shroom" style="width:40px;height:30px')}</span><span>${l}</span>
      <input type="file" class="vh" accept="image/*" capture="environment" data-photo-in="obs:${k}"></label>`; }).join('')}</div></section>
  <section class="sec"><div class="sec-head"><h2 class="sec-title">Identification</h2><span class="sec-meta">01</span></div>
    ${row('Certitude', chips('o.certitude', CERT, o.certitude, false, true))}
    ${row('Méthode', chips('o.methodes', METH, o.methodes, true, true))}
    ${row('Ouvrage', inp('ouvrage', 'Eyssartier & Roux, p. 412', '', 'o-ouv'), 'o-ouv')}
    ${row('Vérifiée par', inp('verif', 'Nom du vérificateur', '', 'o-verif'), 'o-verif')}</section>
  <section class="sec"><div class="sec-head"><h2 class="sec-title">Habitat</h2><span class="sec-meta">02</span></div>
    ${row('Hôte présumé', inp('hote', 'Quercus petraea, châtaignier…', 'la', 'o-hote', 'list="hotes"'), 'o-hote')}
    ${row('Substrat', chips('o.substrat', SUBSTRAT, o.substrat, true, true))}
    ${row('Sol', chips('o.soltype', SOLTYPE, o.soltype, false, true))}</section>
  <section class="sec"><div class="sec-head"><h2 class="sec-title">Population</h2><span class="sec-meta">03</span></div>
    ${row('Exemplaires', `<div class="stepper" style="width:max-content"><button type="button" data-act="oStep" data-d="-1" aria-label="Moins">−</button><output id="o-count">${o.count}</output><button type="button" data-act="oStep" data-d="1" aria-label="Plus">+</button></div>`)}
    ${row('Stade', chips('o.stade', STADE, o.stade, true, true))}
    ${row('Répartition', chips('o.repart', REPART, o.repart, false, true))}
    ${row('Poids', inp('weight', 'g, facultatif', 'num', 'o-w', 'inputmode="decimal"'), 'o-w')}</section>
  <section class="sec"><div class="sec-head"><h2 class="sec-title">Mesures</h2><span class="sec-meta">04 · mm</span></div>
    ${row('Chapeau Ø', `<div class="pair">${inp('capMin', 'min', 'num', 'o-c1', 'inputmode="decimal" aria-label="Chapeau minimum"')}<span class="faint">–</span>${inp('capMax', 'max', 'num', '', 'inputmode="decimal" aria-label="Chapeau maximum"')}</div>`, 'o-c1')}
    ${row('Pied', `<div class="pair">${inp('piedH', 'haut.', 'num', 'o-p1', 'inputmode="decimal" aria-label="Hauteur du pied"')}<span class="faint">×</span>${inp('piedD', 'Ø', 'num', '', 'inputmode="decimal" aria-label="Diamètre du pied"')}</div>`, 'o-p1')}</section>
  <section class="sec"><div class="sec-head"><h2 class="sec-title">Caractères</h2><span class="sec-meta">05</span></div>
    ${row('Odeur', inp('odeur', 'Farine, anis, aucune…', '', 'o-od', 'list="odeurs"'), 'o-od')}
    ${row('Sporée', chips('o.sporee', SPOREE, o.sporee, false, true))}
    ${row('Chair', inp('chair', 'Blanche, immuable, bleuit…', '', 'o-ch'), 'o-ch')}
    ${row('Réactions', inp('reactions', 'KOH : brun ; FeSO₄ : rose…', '', 'o-re'), 'o-re')}</section>
  <section class="sec"><div class="sec-head"><h2 class="sec-title">Notes</h2><span class="sec-meta">06</span></div>
    <textarea class="in" data-bind="o.notes" aria-label="Notes de l'observation" placeholder="Ce que les champs ne disent pas">${esc(o.notes || '')}</textarea></section>
  <div class="stack" style="margin-top:20px">
    <button class="btn tape big block" data-act="saveObs">Enregistrer la fiche</button>
    <p class="faint" style="margin:0;font-size:12px">Les champs de cette fiche suivent le format Darwin Core à l'export : GBIF, INPN ou tableur.</p>
  </div>`;
  return { html };
};

/* ----- Spécimen à identifier ----- */
VIEWS.specimen = ({ id }) => {
  const ex = id ? S.specimens.find(s => s.id === id) : null;
  if (!S.draft || S.draft.kind !== 'specimen' || S.draft.id !== (id || null)) {
    const near = S.lastPos ? nearestSpot(S.lastPos) : null;
    S.draft = ex ? { kind: 'specimen', ...structuredClone(ex) } : { kind: 'specimen', id: null, date: localISO(), spotId: near?.spot.id || '', photos: {}, extra: [], odeur: '', sporee: '', hypothese: '', latin: '', notes: '', status: 'a_identifier', lat: S.lastPos?.lat, lng: S.lastPos?.lng };
  }
  const d = S.draft; const done = STEPS.filter(([k]) => d.photos[k]).length;
  const html = `${topbar(ex ? 'Spécimen' : 'Spécimen à identifier')}${speciesDatalist()}
  <div style="display:flex;flex-direction:column;gap:4px;padding-top:2px"><span class="kicker">Fiche de détermination · ${fmtDots(d.date)}</span>
    <h1 class="title">${d.hypothese ? esc(d.hypothese) : 'Cinq plans, puis le livre.'}</h1>${d.latin ? `<div class="la muted" style="font-size:17px">${esc(d.latin)}</div>` : ''}</div>
  <div class="stack" style="margin-top:14px">
    <div class="row"><div class="tapebar grow"><i style="width:${done * 20}%"></i></div><span class="mono faint" style="font-size:12px">${done}/5</span></div>
    <div class="plans">${STEPS.map(([k, t]) => { const p = d.photos[k]; return `<label class="plan ${p ? '' : 'empty'}"><span class="ph">${p ? `<img data-photo="${p}" alt="${esc(t)}">` : shroom('none', 'none', 'var(--ink-3)', '3 3', 'shroom" style="width:40px;height:30px')}</span><span>${esc(t.toLowerCase().split(' ')[0])}</span><input type="file" class="vh" accept="image/*" capture="environment" data-photo-in="step:${k}"></label>`; }).join('')}</div>
    <p class="faint" style="margin:0;font-size:12px">${STEPS.map(([, t, h]) => `${t} : ${h.toLowerCase()}`).join(' · ')}.</p>
    <div class="field"><span class="label">Prises libres</span>${photoGrid(d.extra, true, 'extra')}</div>
    <div style="border-top:2px solid var(--ink)">
      <div class="fgrid"><span class="label">Odeur</span>${chips('odeur', ODEURS, d.odeur, false, true)}</div>
      <div class="fgrid"><span class="label">Sporée</span>${chips('sporee', SPOREE, d.sporee, false, true)}</div>
      <div class="fgrid"><label class="label" for="f-hyp">Hypothèse</label><div class="stack" style="gap:6px"><input class="in" id="f-hyp" list="species-list" data-bind="hypothese" value="${esc(d.hypothese)}" placeholder="À vérifier au livre" autocomplete="off"><input class="in la" id="f-latin" data-bind="latin" value="${esc(d.latin)}" placeholder="Nom latin" autocomplete="off" aria-label="Nom latin"></div></div>
      <div class="fgrid"><label class="label" for="f-spot2">Récolté à</label><select class="in" id="f-spot2" data-bind="spotId"><option value="">Aucun spot</option>${S.spots.map(s => `<option value="${s.id}" ${d.spotId === s.id ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}</select></div>
      <div class="fgrid"><span class="label">Statut</span>${chips('statusLabel', ['À identifier', 'Identifié'], d.status === 'identifie' ? 'Identifié' : 'À identifier', false, true)}</div>
    </div>
    <div class="field"><label class="label" for="f-notes">Observations</label><textarea class="in" id="f-notes" data-bind="notes" placeholder="Réactions, lait, anneau, chair, page du livre consultée…">${esc(d.notes)}</textarea></div>
    <p class="faint" style="margin:0;font-size:12px">Mycota n'identifie rien à ta place. Ne consomme jamais un champignon sur la seule foi d'une fiche.</p>
    <button class="btn tape big block" data-act="saveSpecimen">Enregistrer le spécimen</button>
    ${ex && ex.status === 'identifie' && !ex.sortieId ? `<button class="btn ink block" data-act="specToSortie" data-id="${ex.id}">Verser dans une sortie</button>` : ''}
    ${ex?.sortieId ? `<button class="btn block" data-act="go" data-v="sortie" data-id="${ex.sortieId}">Voir la sortie liée</button>` : ''}
    ${ex ? `<button class="btn danger block" data-act="delSpecimen" data-id="${ex.id}">${I.trash} Supprimer le spécimen</button>` : ''}
  </div>`;
  return { html };
};

/* ----- Carte ----- */
VIEWS.carte = () => {
  const pts = S.spots.filter(hasPos);
  const html = `<div class="head" style="padding-bottom:10px"><span class="kicker">${plural(pts.length, 'spot placé', 'spots placés')}</span><h1 class="display" style="font-size:44px">Carte</h1></div>
  <div id="bigmap" class="map map-full">
    <div class="map-ctl"><button data-act="mapLocate" aria-label="Ma position">${I.locate}</button><button data-act="mapFit" aria-label="Voir tous les spots">${I.fit}</button><button data-act="mapZoom" data-d="1" aria-label="Zoomer">+</button><button data-act="mapZoom" data-d="-1" aria-label="Dézoomer">−</button></div>
    <div class="map-note" id="map-note" hidden>Fond de carte indisponible hors réseau. Tes spots restent placés les uns par rapport aux autres.</div>
    <div class="map-card" id="map-card" hidden></div>
    ${S.settings.mask ? `<div class="veil" id="veil"><div class="stack" style="align-items:center">${I.lock}<div class="title" style="font-size:24px">Carte masquée</div><p class="muted" style="margin:0">Le masquage des coordonnées est activé.</p><button class="btn" data-act="unveil">Afficher la carte</button></div></div>` : ''}
  </div>`;
  let map;
  const color = s => { const m = markOfSpot(s); return m === 'g' ? 'var(--green)' : m === 'o' ? 'var(--tape)' : 'var(--ink-3)'; };
  const marks = () => {
    const list = pts.map(s => ({ cls: `pin${S.mapSel === s.id ? ' sel' : ''}`, style: `--pc:${color(s)}`, html: '<span></span>', id: s.id, pos: s, label: s.name }));
    if (S.lastPos) list.push({ tag: 'div', cls: 'me', pos: S.lastPos });
    map.setMarks(list);
  };
  return {
    html,
    mount() {
      S.mapSel = null;
      map = new SlipMap($('#bigmap'), { center: pts[0] || S.lastPos || { lat: 45.65, lng: 0.16 }, zoom: 12, onTap: id => { S.mapSel = id; marks(); showCard(id); } });
      map.onOffline = () => { const n = $('#map-note'); if (n) n.hidden = false; };
      S.bigMap = map; S.mapMarks = marks; marks();
      if (pts.length) map.fit(pts); else if (S.lastPos) map.setView(S.lastPos, 14);
    },
    unmount() { map?.destroy(); S.bigMap = null; },
  };
};
function showCard(id) {
  const box = $('#map-card'); if (!box) return;
  const sp = id && spotById(id); if (!sp) { box.hidden = true; return; }
  const last = sortiesOf(id)[0]; box.hidden = false;
  box.innerHTML = `<div class="card"><div class="row"><span class="mark ${markOfSpot(sp)}"></span><div class="grow"><div class="card-t">${esc(sp.name)}</div>
    <div class="card-m">${esc(sp.forest || 'milieu non précisé')}${S.lastPos ? ` · ${fmtDist(distance(S.lastPos, sp))}` : ''} · ${last ? 'dernière sortie ' + ago(last.date) : 'jamais visité'}</div></div></div>
    <div class="btn-row" style="margin-top:10px"><button class="btn" data-act="go" data-v="spot" data-id="${id}">Ouvrir</button><button class="btn ink" data-act="go" data-v="retrouver" data-id="${id}">${I.compass} Retrouver</button></div></div>`;
}

/* ----- Journal ----- */
VIEWS.chrono = () => {
  const f = S.chronoF || (S.chronoF = { q: '', spot: '', sp: '' });
  const allSp = [...new Set(allObs().map(x => x.o.species || x.o.latin))].sort((a, b) => a.localeCompare(b, 'fr'));
  const html = `${topbar('Journal')}
  <div class="stack" style="margin-top:6px">
    <input class="in" id="c-q" type="search" placeholder="Rechercher dans les notes, espèces, spots" value="${esc(f.q)}" aria-label="Rechercher">
    <div class="row"><select class="in" id="c-spot" aria-label="Filtrer par spot"><option value="">Tous les spots</option>${S.spots.map(s => `<option value="${s.id}" ${f.spot === s.id ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}</select>
      <select class="in" id="c-sp" aria-label="Filtrer par espèce"><option value="">Toutes les espèces</option>${allSp.map(n => `<option ${f.sp === n ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select></div>
  </div><div id="c-list"></div>`;
  return { html, mount: renderChronoList };
};
function renderChronoList() {
  const f = S.chronoF, box = $('#c-list'); if (!box) return;
  const q = norm(f.q);
  const list = S.sorties.filter(so => {
    if (f.spot && so.spotId !== f.spot) return false;
    if (f.sp && !(so.obs || []).some(o => (o.species || o.latin) === f.sp)) return false;
    if (q) { const hay = [spotById(so.spotId)?.name, so.notes, so.meteo?.text, ...(so.obs || []).flatMap(o => [o.species, o.latin, o.notes])].join(' ').toLowerCase(); if (!hay.includes(q)) return false; }
    return true;
  }).sort((a, b) => b.date.localeCompare(a.date));
  if (!list.length) { box.innerHTML = `<p class="muted" style="margin-top:20px">${S.sorties.length ? 'Aucune sortie ne correspond à ces filtres.' : 'Tes sorties apparaîtront ici, mois après mois.'}</p>`; return; }
  const groups = new Map(); list.forEach(so => { const d = new Date(so.date); const k = `${d.getFullYear()}-${pad(d.getMonth())}`; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(so); });
  box.innerHTML = [...groups.entries()].map(([k, arr]) => { const [yy, mm] = k.split('-').map(Number);
    return `<section class="sec"><div class="sec-head"><h2 class="sec-title">${MONTHS[mm]} ${yy}</h2><span class="sec-meta">${plural(arr.length, 'sortie', 'sorties')} · ${arr.reduce((a, s) => a + countOf(s), 0)} ex.</span></div><div class="lines">${arr.map(so => sortieLine(so)).join('')}</div></section>`; }).join('');
}

/* ----- Climat ----- */
VIEWS.climat = () => {
  const c = S.climate, rs = rainSummary();
  const html = `<div class="head" style="padding-bottom:6px"><div class="head-top"><span class="kicker">${c ? esc(c.place) + ' · ' + ago(new Date(c.at).toISOString()) : 'pluie autour de toi'}</span><button class="btn" data-act="climRefresh" id="clim-btn" style="min-height:40px">Actualiser</button></div>
    <h1 class="display" style="font-size:44px">Climat</h1><p class="muted" style="margin:0;font-size:13.5px">Les chiffres bruts d'Open-Meteo pour ta position. À toi de juger si tes coins sont prêts.</p></div>
  <div id="clim-body">${c ? climateBody(c, rs) : `<div class="card"><p class="muted" style="margin:0">Aucun relevé pour l'instant. Touche Actualiser : Mycota demande ta position puis la pluie des 30 derniers jours et des 7 prochains.</p></div>`}</div>`;
  return { html, mount() { if (!c || Date.now() - c.at > 3 * 3600e3) ACT.climRefresh(null, true); } };
};
function climateBody(c, rs) {
  const today = dayISO(new Date()), days = c.days, max = Math.max(5, ...days.map(x => x.mm || 0));
  const step = max <= 10 ? 5 : max <= 25 ? 10 : max <= 60 ? 20 : 50, top = Math.ceil(max / step) * step;
  const ti = days.findIndex(x => x.d === today), fc = days.filter(x => x.d > today);
  return `<div class="stats" style="--n:3;margin-top:10px"><div><b>${nf.format(rs.r10)}</b><span>mm sur 10 jours</span></div><div><b>${nf.format(rs.r30)}</b><span>mm sur 30 jours</span></div>
    <div><b>${rs.lastWet ? daysBetween(new Date(rs.lastWet.d), new Date()) + ' j' : '—'}</b><span>${rs.lastWet ? `depuis ${nf.format(rs.lastWet.mm)} mm` : 'pas de pluie ≥ 5 mm'}</span></div></div>
  <section class="sec"><div class="chart">
    <div class="readout" id="readout"><span>Touche une barre</span><span>${rs.next ? `pluie prévue le <b style="font-size:13px">${fmtDayNoYear(rs.next.d)}</b>` : 'pas de pluie prévue'}</span></div>
    <div class="plot">${Array.from({ length: top / step + 1 }, (_, i) => `<div class="grid-y" style="bottom:${i * step / top * 100}%"><span>${i * step}</span></div>`).join('')}
      <div class="bars">${days.map((x, i) => `<button class="barb ${x.d > today ? 'fc' : ''} ${(x.mm || 0) < 0.1 ? 'zero' : ''}" data-act="wxDay" data-i="${i}" style="--h:${Math.max(0, (x.mm || 0) / top * 100)}%" aria-label="${fmtDayNoYear(x.d)} : ${nf.format(x.mm || 0)} mm"><i></i></button>`).join('')}</div>
      ${ti >= 0 ? `<div class="today-line" style="left:calc(${(ti + 1) / days.length * 100}% - 1px)"></div>` : ''}</div>
    <div class="xlab"><span>−30 j</span><span>−15 j</span><span>auj.</span><span>+7 j</span></div>
    <div class="legend"><span><i></i>Mesuré</span><span><i class="fc"></i>Prévu</span><span>mm par jour</span></div></div></section>
  ${fc.length ? `<section class="sec"><div class="sec-head"><h2 class="sec-title">7 prochains jours</h2></div><div class="fc-row">${fc.map(x => { const dd = new Date(x.d + 'T12:00'); return `<div><div class="d">${DAYS_S[dd.getDay()]}</div><div class="t">${Math.round(x.tmax)}°<span class="faint" style="font-weight:400"> ${Math.round(x.tmin)}°</span></div><div class="r ${(x.mm || 0) < 0.5 ? 'dry' : ''}">${(x.mm || 0) < 0.5 ? 'sec' : nf.format(x.mm) + ' mm'}</div></div>`; }).join('')}</div></section>` : ''}
  <details style="margin-top:14px"><summary>Tableau jour par jour</summary><div style="overflow-x:auto"><table class="days"><tr><th>Jour</th><td>Pluie</td><td>Min</td><td>Max</td></tr>${[...days].reverse().map(x => `<tr><th>${fmtDayNoYear(x.d)}${x.d > today ? ' (prévu)' : ''}</th><td>${nf.format(x.mm || 0)} mm</td><td>${Math.round(x.tmin)}°</td><td>${Math.round(x.tmax)}°</td></tr>`).join('')}</table></div></details>`;
}

/* ----- Retrouver ----- */
VIEWS.retrouver = ({ id }) => {
  const sp = spotById(id); if (!sp || !hasPos(sp)) return VIEWS.carnet();
  const needsPerm = typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function';
  const html = `${topbar('Retrouver')}
  <div class="finder"><span class="kicker">Direction de</span><h1 class="title">${esc(sp.name)}</h1>
    <div class="dial"><div class="rose" id="rose"><span class="n">N</span></div>
      <div class="arrow" id="arrow"><svg viewBox="0 0 100 100" aria-hidden="true"><path d="M50 6 L70 62 L50 52 L30 62 Z" fill="var(--tape)" stroke="var(--ink)" stroke-width="2"/><path d="M50 52 L70 62 L50 94 L30 62 Z" fill="var(--sunk)" stroke="var(--ink)" stroke-width="2"/></svg></div></div>
    <div class="dist" id="dist">…</div><div class="muted" id="dir">Recherche de ta position</div><div class="mono faint" id="acc" style="font-size:12px"></div>
    <p class="faint" id="hint" style="font-size:13px;max-width:320px">${needsPerm ? 'Active la boussole pour que la flèche suive ton téléphone.' : 'Tiens le téléphone à plat. Sans boussole, la flèche se lit par rapport au nord indiqué en haut du cadran.'}</p>
    ${needsPerm ? '<button class="btn" data-act="compass" id="cmp-btn">Activer la boussole</button>' : ''}</div>`;
  let watch = null, heading = null, pos = null;
  const update = () => {
    if (!pos) return;
    const d = distance(pos, sp), b = bearing(pos, sp), here = d < 15;
    $('#dist').textContent = here ? 'Ici' : fmtDist(d);
    $('#dir').textContent = here ? 'Tu es sur le spot.' : `Cap ${Math.round(b)}° · ${cardinal(b)}`;
    $('#acc').textContent = `précision GPS ±${Math.round(pos.acc)} m`;
    $('#arrow').style.transform = `rotate(${here ? 0 : (heading == null ? b : b - heading)}deg)`; $('#arrow').style.opacity = here ? '0.25' : '1';
    $('#rose').style.transform = `rotate(${heading == null ? 0 : -heading}deg)`;
  };
  const onOri = e => { let h = null; if (typeof e.webkitCompassHeading === 'number') h = e.webkitCompassHeading; else if (e.absolute && typeof e.alpha === 'number') h = 360 - e.alpha; if (h != null) { heading = h; update(); } };
  S.attachCompass = () => { window.addEventListener('deviceorientationabsolute', onOri); window.addEventListener('deviceorientation', onOri); };
  return {
    html,
    mount() {
      if (!needsPerm) S.attachCompass();
      if (!('geolocation' in navigator)) { $('#dir').textContent = posError('unsupported'); return; }
      try { watch = navigator.geolocation.watchPosition(p => { pos = { lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy }; S.lastPos = { ...pos, at: Date.now() }; update(); },
        e => { $('#dist').textContent = '—'; $('#dir').textContent = posError(e.code === 1 ? 'denied' : 'unavailable'); }, { enableHighAccuracy: true, maximumAge: 2000, timeout: 20000 }); }
      catch { $('#dir').textContent = posError('unavailable'); }
    },
    unmount() { if (watch != null) navigator.geolocation.clearWatch(watch); window.removeEventListener('deviceorientationabsolute', onOri); window.removeEventListener('deviceorientation', onOri); },
  };
};

  delSortie(t) { confirmSheet({ title: 'Supprimer cette sortie ?', text: 'Ses observations, ses fiches et ses photos seront effacées de ce téléphone.', ok: 'Supprimer', onOk: async () => { await deleteRec('sortie', t.dataset.id); S.draft = null; toast('Sortie supprimée.'); go('carnet', {}, { replace: true }); } }); },

      <input class="in" type="password" id="v1" autocomplete="new-password" placeholder="Code" aria-label="Code"><input class="in" type="password" id="v2" autocomplete="new-password" placeholder="Confirmer le code" aria-label="Confirmer le code">

    toast('Préparation de la sauvegarde…');
    const photos = await DB.all('photos').catch(() => []);
    const toData = b => new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.onerror = () => r(null); fr.readAsDataURL(b); });
    const out = { app: 'Mycota', format: 2, exportedAt: new Date().toISOString(), note: 'Contient les coordonnées de tes spots en clair.', spots: S.spots, sorties: S.sorties, specimens: S.specimens, settings: S.settings, seen: S.seen,
      photos: await Promise.all(photos.map(async p => ({ id: p.id, createdAt: p.createdAt, blob: await toData(p.blob), thumb: p.thumb ? await toData(p.thumb) : null }))) };
    await saveFile(`mycota-sauvegarde-${dayISO(new Date())}.json`, new Blob([JSON.stringify(out)], { type: 'application/json' }));
  },
  async exportDwC() {
    const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
    const cols = ['occurrenceID', 'basisOfRecord', 'eventDate', 'scientificName', 'vernacularName', 'individualCount', 'identificationQualifier', 'identifiedBy', 'identificationReferences', 'decimalLatitude', 'decimalLongitude', 'coordinateUncertaintyInMeters', 'locality', 'habitat', 'associatedTaxa', 'substrate', 'lifeStage', 'occurrenceRemarks', 'country', 'countryCode', 'stateProvince'];
    const rows = [cols];
    allObs().sort((a, b) => a.so.date.localeCompare(b.so.date)).forEach(({ so, o, i }) => {
      const sp = spotById(so.spotId) || {}, p = posOfSortie(so) || {};
      const rem = [o.capMin || o.capMax ? `chapeau ${o.capMin || '?'}-${o.capMax || '?'} mm` : '', o.piedH || o.piedD ? `pied ${o.piedH || '?'} x ${o.piedD || '?'} mm` : '', o.sporee ? `sporée ${o.sporee.toLowerCase()}` : '', o.odeur ? `odeur ${o.odeur.toLowerCase()}` : '', o.chair ? `chair ${o.chair}` : '', o.reactions ? `réactions ${o.reactions}` : '', o.repart ? o.repart.toLowerCase() : '', so.wx ? `pluie 10 j ${so.wx.mm} mm` : '', o.notes || ''].filter(Boolean).join(' ; ');
      rows.push([`mycota:${so.id}:${i}`, 'HumanObservation', so.date, o.latin || o.species, o.species, o.count, o.certitude === 'Certaine' ? '' : (o.certitude || ''), o.verif || '', o.ouvrage || '',
        S.settings.mask || !hasPos(p) ? '' : p.lat.toFixed(2), S.settings.mask || !hasPos(p) ? '' : p.lng.toFixed(2), hasPos(p) ? 1000 : '', sp.name || '', [sp.forest, o.soltype ? 'sol ' + o.soltype.toLowerCase() : ''].filter(Boolean).join(', '),
        o.hote || '', (o.substrat || []).join(' | '), (o.stade || []).join(' | '), rem, 'France', 'FR', 'Charente']);
    });
    const csv = '﻿' + rows.map(r => r.map(q).join(',')).join('\r\n');
    await saveFile(`mycota-darwin-core-${dayISO(new Date())}.csv`, new Blob([csv], { type: 'text/csv' }));
  },
  async exportGPX() {
    const gpx = `<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="Mycota" xmlns="http://www.topografix.com/GPX/1/1">\n${S.spots.filter(hasPos).map(s => `  <wpt lat="${s.lat.toFixed(6)}" lon="${s.lng.toFixed(6)}"><name>${esc(s.name)}</name><desc>${esc([s.forest, s.notes].filter(Boolean).join(' — '))}</desc></wpt>`).join('\n')}\n</gpx>\n`;
    await saveFile(`mycota-spots-${dayISO(new Date())}.gpx`, new Blob([gpx], { type: 'application/gpx+xml' }));
  },
  loadDemo() { confirmSheet({ title: 'Charger des exemples ?', text: 'Trois spots fictifs et quelques sorties, marqués comme exemples. Tu pourras les retirer en un geste.', ok: 'Charger', danger: false, onOk: async () => { await loadDemo(); toast('Exemples chargés.'); go('carnet', {}, { replace: true }); } }); },
  async clearDemo() { for (const k of ['sortie', 'specimen', 'spot']) for (const r of [...S[STORE_OF[k]]]) if (r.demo) await deleteRec(k, r.id); toast('Exemples retirés.'); render(); },
  wipe() { confirmSheet({ title: 'Tout effacer ?', text: 'Spots, sorties, spécimens et photos seront supprimés de ce téléphone. Sans sauvegarde, rien ne pourra être récupéré.', ok: 'Tout effacer', onOk: async () => {
    for (const s of STORES) await DB.clear(s).catch(() => {});
    Object.assign(S, { spots: [], sorties: [], specimens: [], climate: null, settings: { mask: false }, vault: null, seen: {} }); Vault.key = null;
    toast('Carnet effacé.'); go('carnet', {}, { replace: true }); } }); },
};

/* ---------- évènements ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t || t.closest('.map-marks')) return;
  const f = ACT[t.dataset.act]; if (f) { e.preventDefault(); f(t, e); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'c-q') { S.chronoF.q = t.value; renderChronoList(); }
  if (t.id === 'dex-q') { S.codexF.q = t.value; renderDex(); }
});
document.addEventListener('change', async e => {
  const t = e.target;
  if (t.id === 'c-spot' || t.id === 'c-sp') { S.chronoF[t.id === 'c-spot' ? 'spot' : 'sp'] = t.value; renderChronoList(); return; }
  if (t.id === 'f-spot' && S.draft?.kind === 'sortie') { syncDraft(); render(); return; }
  if (t.dataset.sp !== undefined || t.id === 'o-fr' || t.id === 'f-hyp') {
    const m = matchLatin(t.value);
    const la = t.dataset.sp !== undefined ? $(`#la-${t.dataset.sp}`) : t.id === 'o-fr' ? $('#o-la') : $('#f-latin');
    if (m && la) { if (!la.value) la.value = m.la; if (m.viaLatin) { t.value = m.fr; la.value = m.la; } }
    return;
  }
  if (t.dataset.import) { await importFile(t.files[0]); t.value = ''; return; }
  if (t.dataset.photoIn && t.files?.length) {
    const target = t.dataset.photoIn, files = [...t.files], d = S.draft; if (!d) return;
    syncDraft(); toast(files.length > 1 ? `Ajout de ${files.length} photos…` : 'Ajout de la photo…');
    try {
      for (const f of files) {
        const id = await addPhoto(f);
        if (target === 'draft') d.photoIds.push(id);
        else if (target === 'extra') d.extra.push(id);
        else if (target.startsWith('step:')) { const k = target.slice(5); if (d.photos[k]) DB.del('photos', d.photos[k]).catch(() => {}); d.photos[k] = id; }
        else if (target.startsWith('obs:')) { const k = target.slice(4); d.o.photos = d.o.photos || {}; if (d.o.photos[k]) DB.del('photos', d.o.photos[k]).catch(() => {}); d.o.photos[k] = id; }
      }
      if (d.kind === 'specimen' && !hasPos(d) && hasPos(S.lastPos)) Object.assign(d, { lat: S.lastPos.lat, lng: S.lastPos.lng });
      render(); const tt = $('.toast'); if (tt) tt.hidden = true;
    } catch { toast("Cette image n'a pas pu être lue. Essaie une photo prise par l'appareil."); }
  }
});

/* ---------- import ---------- */
function dataURLtoBlob(d) { const [h, b] = d.split(','); const mime = (h.match(/data:(.*?);/) || [])[1] || 'image/jpeg'; const bin = atob(b); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return new Blob([u], { type: mime }); }
async function importFile(file) {
  if (!file) return; let j;
  try { j = JSON.parse(await file.text()); } catch { toast("Ce fichier n'est pas une sauvegarde lisible."); return; }
  if (j.app !== 'Mycota') { toast("Ce fichier n'est pas une sauvegarde Mycota."); return; }
  toast('Restauration…');
  for (const p of j.photos || []) if (p.blob) await DB.put('photos', { id: p.id, createdAt: p.createdAt, blob: dataURLtoBlob(p.blob), thumb: p.thumb ? dataURLtoBlob(p.thumb) : null });
  for (const r of j.spots || []) await saveRec('spot', r);
  for (const r of j.sorties || []) await saveRec('sortie', r);
  for (const r of j.specimens || []) await saveRec('specimen', r);
  if (j.seen) { S.seen = { ...j.seen, ...S.seen }; metaPut('seen', S.seen); }
  toast(`Restauré : ${plural((j.spots || []).length, 'spot', 'spots')}, ${plural((j.sorties || []).length, 'sortie', 'sorties')}.`);
  go('carnet', {}, { replace: true });
}

/* ---------- exemples ---------- */

  const now = new Date();
  const back = (d, h = 10) => { const x = new Date(now); x.setDate(x.getDate() - d); x.setHours(h, 30, 0, 0); return localISO(x); };
  const spots = [
    { id: 'demo-s1', name: 'Chênaie du Puits-Rond', forest: 'Chênaie-charmaie', lat: 45.69352, lng: 0.29148, notes: 'Vieux chênes sessiles sur le versant nord, sol calcaire sous la mousse. Entrer par le chemin forestier, à gauche après la barrière.' },
    { id: 'demo-s2', name: 'Hêtraie de la Combe', forest: 'Hêtraie', lat: 45.71023, lng: 0.30577, notes: 'Fond de vallon frais, litière épaisse.' },
    { id: 'demo-s3', name: 'Lisière aux châtaigniers', forest: 'Châtaigneraie', lat: 45.82894, lng: 0.19722, notes: 'Talus exposé sud-est. Donne tôt, sèche vite.' },
  ].map(s => ({ ...s, demo: true }));
  const O = (fr, count, extra = {}) => ({ ...blankObs(fr, REF_BY_FR.get(norm(fr))?.la || ''), count, ...extra });
  const sorties = [
    { spotId: 'demo-s1', date: back(4), obs: [O('Cèpe de Bordeaux', 7, { certitude: 'Certaine', methodes: ['Macroscopie', 'Sporée'], ouvrage: 'Eyssartier & Roux', hote: 'Quercus petraea', substrat: ['Sol'], soltype: 'Calcaire', stade: ['Jeunes', 'Matures'], repart: 'Dispersés', capMin: '62', capMax: '118', piedH: '70', piedD: '34', sporee: 'Brun olive', odeur: 'Fongique', chair: 'Blanche, immuable' }), O('Girolle', 23, { certitude: 'Certaine', hote: 'Quercus petraea' })], meteo: { sol: 'Humide', ciel: ['Nuageux'], text: 'Grosse pluie dix jours plus tôt' }, notes: 'Spécimens jeunes au pied des deux chênes jumeaux.', wx: { mm: 34.2, days: 10 } },
    { spotId: 'demo-s2', date: back(11), obs: [], meteo: { sol: 'Sec', ciel: ['Soleil'], text: 'Litière craquante' }, notes: 'Trop tôt.', wx: { mm: 6.1, days: 10 } },
    { spotId: 'demo-s3', date: back(19), obs: [O('Cèpe bronzé', 3), O('Amanite des Césars', 2, { hote: 'Castanea sativa', soltype: 'Acide' })], meteo: { sol: 'Frais', ciel: ['Soleil'], text: '' }, notes: 'Les Césars laissées en place.', wx: { mm: 21.8, days: 10 } },
    { spotId: 'demo-s1', date: back(33), obs: [O('Girolle', 41), O('Russule charbonnière', 6)], meteo: { sol: 'Humide', ciel: ['Pluie'], text: 'Bruine continue' }, notes: '', wx: { mm: 48.5, days: 10 } },
    { spotId: 'demo-s2', date: back(372), obs: [O('Trompette de la mort', 120), O('Pied-de-mouton', 15)], meteo: { sol: 'Détrempé', ciel: ['Brouillard', 'Gelée'], text: 'Premier coup de gel la veille' }, notes: 'Poussée le long du ru.', wx: { mm: 62.0, days: 10 } },
  ].map((s, i) => ({ id: 'demo-o' + i, photoIds: [], demo: true, ...s }));
  const specimens = [{ id: 'demo-m1', date: back(4, 16), spotId: 'demo-s1', photos: {}, extra: [], odeur: 'Farine', sporee: 'Rose', hypothese: 'Clitocybe nébuleux', latin: 'Clitocybe nebularis', notes: "Lames décurrentes serrées. À comparer avec l'entolome livide avant tout.", status: 'a_identifier', demo: true }];
  for (const s of spots) await saveRec('spot', s);
  for (const s of sorties) await saveRec('sortie', s);
  for (const s of specimens) await saveRec('specimen', s);
}

/* ---------- démarrage ---------- */
function afterBoot() { try { navigator.storage?.persist?.(); } catch { /* sans effet */ } syncWeather(); window.addEventListener('online', syncWeather); }
(async () => {
  await DB.open();
  if (DB.mem) setTimeout(() => toast('Stockage indisponible : rien ne sera conservé après fermeture.'), 600);
  if (!IN_CLAUDE && 'serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('./sw.js').catch(() => {});
  const vault = await DB.get('meta', 'vault').catch(() => null);
  if (vault) { S.vault = vault.value; S.view = 'lock'; render(); return; }
  await loadAll();
  const st = history.state;
  if (st && st.view && st.view !== 'lock' && VIEWS[st.view]) { S.view = st.view; S.params = st.params || {}; }
  if (S.view === 'chrono' && !st) S.view = 'carnet';
  try { history.replaceState({ view: S.view, params: S.params, depth: st?.depth || 0 }, ''); } catch { /* cadre restreint */ }
  render(); afterBoot();
})();
</script>
