<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F4EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1411" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mycota">
<meta name="description" content="Carnet de terrain privé du mycologue : spots, sorties, spécimens. Tout reste sur ton téléphone.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Mycota</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,400..800;1,62..125,400..700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}</style>
</head>
<body>
<style>
/* Relevé de terrain : carnet de prospection à une colonne, courbes de niveau, rubans de marquage, chiffres en chasse fixe. */
:root {
  --bg: #F3F4EE;
  --card: #FFFFFF;
  --sunk: #E7EADF;
  --ink: #111814;
  --ink-2: #4B5650;
  --ink-3: #5E6862;
  --line: #D9DDD3;
  --line-2: #C2C8BC;
  --green: #2E6A43;
  --green-soft: rgba(46, 106, 67, 0.12);
  --tape: #FF5B1F;
  --tape-2: #FF7A45;
  --on-tape: #111814;
  --danger: #9E1F17;
  --rain: #3E6E86;
  --f-ui: "Archivo", "Helvetica Neue", Arial, system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --tabbar-h: 66px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1411; --card: #18201B; --sunk: #202A24; --ink: #E8ECE6; --ink-2: #A9B3AC; --ink-3: #939D96;
    --line: #2B362F; --line-2: #3A473F; --green: #7CC495; --green-soft: rgba(124, 196, 149, 0.15);
    --tape: #FF6A33; --tape-2: #FF8A5C; --on-tape: #111814; --danger: #F0857B; --rain: #86B4CB; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1411; --card: #18201B; --sunk: #202A24; --ink: #E8ECE6; --ink-2: #A9B3AC; --ink-3: #939D96;
  --line: #2B362F; --line-2: #3A473F; --green: #7CC495; --green-soft: rgba(124, 196, 149, 0.15);
  --tape: #FF6A33; --tape-2: #FF8A5C; --on-tape: #111814; --danger: #F0857B; --rain: #86B4CB; color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-ui); font-size: 15px; line-height: 1.42;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
#app { max-width: 560px; margin: 0 auto; padding-block: 6px calc(var(--tabbar-h) + 44px + env(safe-area-inset-bottom, 0px)); position: relative; }
#app.no-tabs { padding-block-end: 44px; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--tape); outline-offset: 2px; }
.vh { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.la { font-style: italic; }
.muted { color: var(--ink-2); }
.faint { color: var(--ink-3); }
.row { display: flex; align-items: center; gap: 10px; }
.grow { flex: 1; min-width: 0; }
.stack { display: flex; flex-direction: column; gap: 12px; }

/* Typo */
.kicker { font-family: var(--f-mono); font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2); }
.display { margin: 0; font-weight: 800; font-stretch: 70%; text-transform: uppercase; line-height: 0.9; letter-spacing: -0.01em; font-size: 54px; text-wrap: balance; }
.title { margin: 0; font-weight: 700; font-stretch: 80%; font-size: 32px; line-height: 1.02; text-wrap: balance; }
.title.la { font-weight: 700; }
.sub { font-size: 17px; font-weight: 600; }
.sec { margin-top: 24px; }
.sec-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; border-top: 2px solid var(--ink); padding-top: 6px; margin-bottom: 10px; }
.sec-title { margin: 0; font-size: 14px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; font-stretch: 85%; }
.sec-meta { font-family: var(--f-mono); font-size: 11.5px; color: var(--ink-2); }
.link { border: 0; background: none; padding: 6px 0; color: var(--green); font-weight: 600; font-size: 14px; text-decoration: none; }

/* En-tête topo */
.topo { position: absolute; left: -16px; right: -16px; top: 0; height: 240px; pointer-events: none; color: var(--green); opacity: 0.16; overflow: hidden; }
.topo svg { width: 100%; height: 100%; }
.head { position: relative; padding: 16px 0 4px; display: flex; flex-direction: column; gap: 12px; }
.head-top { display: flex; justify-content: space-between; align-items: center; min-height: 44px; }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 6px; margin: 0 -8px; padding: 6px 0; background: var(--bg); }
.bar-title { flex: 1; min-width: 0; text-align: center; font-family: var(--f-mono); font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon-btn { width: 44px; height: 44px; display: inline-grid; place-items: center; border: 0; border-radius: 8px; background: transparent; color: var(--ink); flex: none; }
.icon-btn:active { background: var(--sunk); }
svg.i { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* Chiffres */
.stats { display: grid; grid-template-columns: repeat(var(--n, 3), minmax(0, 1fr)); border-top: 2px solid var(--ink); border-bottom: 1px solid var(--line); }
.stats div { padding: 9px 0; display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.stats b { font-family: var(--f-mono); font-size: 21px; font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.stats span { font-size: 11.5px; color: var(--ink-2); }
.tapebar { height: 14px; background: var(--sunk); border-radius: 2px; overflow: hidden; }
.tapebar i { display: block; height: 100%; background: repeating-linear-gradient(135deg, var(--tape) 0 8px, var(--tape-2) 8px 16px); }
.gauge { height: 6px; background: var(--sunk); border-radius: 2px; overflow: hidden; }
.gauge i { display: block; height: 100%; background: var(--green); }
.gauge.full i { background: repeating-linear-gradient(135deg, var(--tape) 0 6px, var(--tape-2) 6px 12px); }

/* Rubans */
.ribbon { display: inline-flex; align-items: center; gap: 6px; font-family: var(--f-mono); font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; background: var(--tape); color: var(--on-tape); padding: 3px 12px 3px 8px; clip-path: polygon(0 0, 100% 0, calc(100% - 7px) 50%, 100% 100%, 0 100%); }
.pill { display: inline-block; font-family: var(--f-mono); font-size: 10.5px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; padding: 2px 6px; border-radius: 3px; border: 1px solid var(--ink); color: var(--ink); }
.pill.green { background: var(--green); border-color: var(--green); color: var(--bg); }
.pill.danger { background: var(--danger); border-color: var(--danger); color: #FFF; }
.pill.tape { background: var(--tape); border-color: var(--tape); color: var(--on-tape); }
.pill.ghost { border-style: dashed; color: var(--ink-2); border-color: var(--line-2); }

/* Cartes et listes */
.card { display: block; width: 100%; text-align: left; border: 1px solid var(--line); background: var(--card); color: inherit; border-radius: 8px; padding: 13px 14px; box-shadow: 0 1px 0 var(--line); text-decoration: none; }
button.card:active { transform: scale(0.993); }
.cards { display: flex; flex-direction: column; gap: 8px; }
.card-t { font-weight: 650; font-size: 16px; line-height: 1.25; }
.card-m { font-family: var(--f-mono); font-size: 11.5px; color: var(--ink-2); margin-top: 2px; }
.card-l { font-size: 13.5px; color: var(--ink-2); margin-top: 6px; }
.card-side { text-align: right; flex: none; font-size: 11px; color: var(--ink-2); line-height: 1.35; }
.card-side b { display: block; font-family: var(--f-mono); font-size: 18px; color: var(--ink); font-weight: 600; }
.mark { width: 10px; height: 10px; border-radius: 2px; flex: none; background: var(--line-2); }
.mark.g { background: var(--green); } .mark.o { background: var(--tape); }
.lines > * { border-top: 1px solid var(--line); }
.lines > *:last-child { border-bottom: 1px solid var(--line); }
.li { display: flex; align-items: center; gap: 10px; padding: 11px 0; width: 100%; background: none; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; color: inherit; text-decoration: none; }
.kv { display: grid; grid-template-columns: 104px minmax(0, 1fr); gap: 10px; padding: 9px 0; align-items: center; }
.kv > span:first-child { font-family: var(--f-mono); font-size: 11.5px; color: var(--ink-2); }
.notice { margin-top: 12px; padding: 10px 12px; border-radius: 6px; background: var(--sunk); font-size: 13.5px; color: var(--ink-2); }
.notice b { color: var(--ink); }

/* Boutons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 16px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--card); color: var(--ink); font-weight: 650; font-size: 15px; text-decoration: none; }
.btn.ink { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn.tape { background: var(--tape); color: var(--on-tape); border-color: var(--tape); }
.btn.danger { color: var(--danger); }
.btn.block { width: 100%; }
.btn.big { min-height: 56px; font-size: 16px; }
.btn:disabled { opacity: 0.45; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
.btn-row .btn { flex: 1 1 140px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { min-height: 36px; padding: 0 12px; border-radius: 18px; border: 1px solid var(--line-2); background: var(--card); color: var(--ink-2); font-size: 13.5px; font-weight: 500; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); font-weight: 600; }
.chip.sq { border-radius: 4px; min-height: 34px; padding: 0 10px; font-size: 13px; }
.scroll-x { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px; }
.scroll-x::-webkit-scrollbar { display: none; }

/* Formulaires */
.field { display: flex; flex-direction: column; gap: 6px; }
.label { font-family: var(--f-mono); font-size: 11.5px; color: var(--ink-2); }
.in { width: 100%; min-height: 46px; padding: 10px 12px; border-radius: 6px; border: 1px solid var(--line-2); background: var(--card); font-size: 16px; outline: none; appearance: none; }
.in:focus { border-color: var(--ink); }
.in.la { font-style: italic; }
.in.num { font-family: var(--f-mono); }
textarea.in { min-height: 86px; resize: vertical; line-height: 1.45; }
select.in { background-image: linear-gradient(45deg, transparent 50%, var(--ink-2) 50%), linear-gradient(135deg, var(--ink-2) 50%, transparent 50%); background-position: calc(100% - 18px) 20px, calc(100% - 13px) 20px; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 34px; }
.fgrid { display: grid; grid-template-columns: 104px minmax(0, 1fr); gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); align-items: center; }
.fgrid > .label { align-self: center; }
.pair { display: flex; gap: 6px; align-items: center; }
.pair .in { min-width: 0; }
.obs-row { border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.obs-qty { display: flex; gap: 8px; align-items: center; }
.stepper { display: flex; align-items: center; border: 1px solid var(--line-2); border-radius: 6px; background: var(--card); }
.stepper button { width: 46px; height: 44px; border: 0; background: none; font-size: 22px; color: var(--ink); }
.stepper output { min-width: 40px; text-align: center; font-family: var(--f-mono); font-weight: 600; font-size: 17px; }

/* Photos */
.photos { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.ph { position: relative; aspect-ratio: 1; max-width: 100%; border-radius: 6px; overflow: hidden; background: var(--sunk); border: 0; padding: 0; display: block; width: 100%; }
.ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ph .x { position: absolute; top: 4px; right: 4px; width: 30px; height: 30px; border-radius: 50%; border: 0; background: rgba(17, 24, 20, 0.65); color: #F3F4EE; font-size: 15px; }
.ph-add { display: grid; place-items: center; align-content: center; gap: 2px; font-family: var(--f-mono); font-size: 11px; color: var(--ink-2); border: 1.5px dashed var(--line-2); background: transparent; cursor: pointer; }
.plans { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.plan { display: flex; flex-direction: column; gap: 4px; cursor: pointer; }
.plan .ph { aspect-ratio: 1; }
.plan span { font-family: var(--f-mono); font-size: 10px; color: var(--ink-2); text-align: center; }
.plan.empty .ph { background: transparent; border: 1.5px dashed var(--line-2); display: grid; place-items: center; }

/* Mycodex */
.dex { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.cell { display: flex; flex-direction: column; align-items: stretch; gap: 2px; padding: 8px 8px 10px; min-height: 136px; border-radius: 6px; border: 1px solid var(--line); background: var(--card); box-shadow: 0 1px 0 var(--line); text-align: left; color: inherit; min-width: 0; }
.cell.no { border: 1.5px dashed var(--line-2); background: transparent; box-shadow: none; }
.cell-top { display: flex; justify-content: space-between; align-items: center; gap: 4px; min-height: 18px; }
.cell-n { font-family: var(--f-mono); font-size: 11px; font-weight: 600; color: var(--green); }
.cell.no .cell-n { color: var(--ink-3); }
.cell-art { height: 50px; display: grid; place-items: center; margin: 3px 0 4px; }
.cell-art img { width: 100%; height: 50px; object-fit: cover; border-radius: 4px; }
.cell-fr { font-size: 12.5px; font-weight: 650; line-height: 1.15; }
.cell.no .cell-fr { color: var(--ink-2); font-weight: 600; }
.cell-gb { margin-top: auto; padding-top: 4px; font-family: var(--f-mono); font-size: 10px; color: var(--ink-3); }
.cell-la { font-size: 11px; font-style: italic; color: var(--ink-2); line-height: 1.2; overflow-wrap: anywhere; }
.shroom { width: 56px; height: 42px; }
.hunt { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.hunt .cell { min-height: 0; border-color: var(--tape); border-style: dashed; border-width: 1.5px; background: transparent; box-shadow: none; }
.months { display: grid; grid-template-columns: 64px repeat(12, minmax(0, 1fr)); gap: 3px; align-items: center; }
.months > span:not(.ml) { height: 22px; border-radius: 2px; background: var(--sunk); }
.months .on { background: var(--green); }
.months .ref { background: repeating-linear-gradient(135deg, var(--tape) 0 3px, transparent 3px 6px); box-shadow: inset 0 0 0 1px var(--tape); }
.months .ml { font-size: 11.5px; color: var(--ink-2); height: auto; background: none; }
.months .mm { font-family: var(--f-mono); font-size: 10px; color: var(--ink-2); text-align: center; height: auto; background: none; }
.months .now { box-shadow: inset 0 -2px 0 var(--ink); }

/* Rubans */
.ribbons { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.rb { border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.rb.no { border-style: dashed; border-color: var(--line-2); background: transparent; }
.rb-t { font-weight: 700; font-size: 15px; }
.rb-d { font-size: 12.5px; color: var(--ink-2); line-height: 1.35; }
.rank { border: 2px solid var(--ink); border-radius: 8px; padding: 14px; background: var(--card); display: flex; flex-direction: column; gap: 8px; }

/* Barre d'onglets */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: color-mix(in srgb, var(--bg) 94%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--line);
  padding: 6px max(10px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(10px, env(safe-area-inset-left, 0px)); }
.tabbar-in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr 76px 1fr 1fr; align-items: center; }
.tab { display: flex; flex-direction: column; align-items: center; gap: 2px; border: 0; background: none; color: var(--ink-2); font-size: 11px; font-weight: 600; padding: 6px 0; min-height: 52px; }
.tab[aria-current="page"] { color: var(--ink); }
.tab[aria-current="page"] svg { stroke-width: 2.3; }
.fab { justify-self: center; width: 58px; height: 58px; margin-top: -24px; border-radius: 16px; border: 3px solid var(--ink); background: var(--tape); color: var(--on-tape); display: grid; place-items: center; }
.fab svg { width: 26px; height: 26px; stroke: currentColor; fill: none; stroke-width: 2.6; stroke-linecap: round; }

/* Feuille, toast, visionneuse */
.scrim { position: fixed; inset: 0; z-index: 60; background: rgba(15, 20, 17, 0.45); display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 560px; background: var(--bg); border-radius: 16px 16px 0 0; max-height: 88dvh; overflow: auto;
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(22px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); animation: up 0.2s ease-out; }
.sheet .grab { width: 40px; height: 5px; border-radius: 99px; background: var(--line-2); margin: 0 auto 14px; }
@keyframes up { from { transform: translateY(30px); opacity: 0.6; } }
.choice { display: flex; gap: 12px; align-items: center; }
.choice .ic { width: 44px; height: 44px; border-radius: 8px; display: grid; place-items: center; background: var(--sunk); color: var(--ink); flex: none; }
.toast { position: fixed; left: 50%; bottom: calc(var(--tabbar-h) + 30px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 80; background: var(--ink); color: var(--bg); padding: 11px 16px; border-radius: 8px; font-size: 14px; font-weight: 500; max-width: calc(100vw - 32px); }
.toast.win { background: var(--tape); color: var(--on-tape); font-weight: 650; }
.viewer { position: fixed; inset: 0; z-index: 90; background: #0B0E0C; display: grid; place-items: center; }
.viewer img { max-width: 100%; max-height: 100%; object-fit: contain; }
.viewer button { position: absolute; top: calc(10px + env(safe-area-inset-top, 0px)); right: max(10px, env(safe-area-inset-right, 0px)); color: #E8ECE6; }

/* Carte */
.map { position: relative; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; border-radius: 8px; border: 1px solid var(--line); background-color: var(--sunk);
  background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px); background-size: 48px 48px; }
.map-full { height: calc(100dvh - var(--tabbar-h) - 150px - env(safe-area-inset-bottom, 0px) - env(safe-area-inset-top, 0px)); min-height: 340px; }
.map-pick { height: 250px; }
.map-tiles, .map-marks { position: absolute; inset: 0; }
.tile { position: absolute; left: 0; top: 0; max-width: none; pointer-events: none; }
:root[data-theme="dark"] .tile { filter: brightness(0.72) contrast(1.1) saturate(0.7); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tile { filter: brightness(0.72) contrast(1.1) saturate(0.7); } }
.tile.miss { visibility: hidden; }
.pin { position: absolute; left: 0; top: 0; width: 34px; height: 34px; margin: -34px 0 0 -17px; border: 0; background: none; padding: 0; }
.pin span { position: absolute; left: 6px; top: 2px; width: 22px; height: 22px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); background: var(--pc, var(--ink-3)); border: 3px solid var(--card); box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3); }
.pin.sel span { width: 28px; height: 28px; left: 3px; top: -4px; }
.me { position: absolute; left: 0; top: 0; width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%; background: var(--rain); border: 3px solid #FFF; box-shadow: 0 0 0 7px color-mix(in srgb, var(--rain) 25%, transparent); pointer-events: none; }

/* ---------- stockage local ---------- */
const STORES = ['spots', 'sorties', 'specimens', 'photos', 'meta'];
const DB = {
  db: null, mem: null,
  open() {
    return new Promise(res => {
      const fallback = () => { this.mem = Object.fromEntries(STORES.map(s => [s, new Map()])); res(false); };
      try {
        const r = indexedDB.open('mycota', 1);
        r.onupgradeneeded = () => { const d = r.result; STORES.forEach(s => { if (!d.objectStoreNames.contains(s)) d.createObjectStore(s, { keyPath: 'id' }); }); };
        r.onsuccess = () => { this.db = r.result; res(true); };
        r.onerror = fallback; r.onblocked = fallback;
      } catch { fallback(); }
    });
  },
  run(store, mode, fn) {
    if (this.mem) {
      const m = this.mem[store];
      const fake = { getAll: () => ({ result: [...m.values()] }), get: k => ({ result: m.get(k) }), put: v => { m.set(v.id, v); return { result: v.id }; }, delete: k => { m.delete(k); return {}; }, clear: () => { m.clear(); return {}; } };
      return Promise.resolve(fn(fake).result);
    }
    return new Promise((res, rej) => {
      let t; try { t = this.db.transaction(store, mode); } catch (e) { rej(e); return; }
      const r = fn(t.objectStore(store));
      t.oncomplete = () => res(r ? r.result : undefined);
      t.onerror = t.onabort = () => rej(t.error);
    });
  },
  all(s) { return this.run(s, 'readonly', st => st.getAll()); },
  get(s, k) { return this.run(s, 'readonly', st => st.get(k)); },
  put(s, v) { return this.run(s, 'readwrite', st => st.put(v)); },
  del(s, k) { return this.run(s, 'readwrite', st => st.delete(k)); },
  clear(s) { return this.run(s, 'readwrite', st => st.clear()); },
};

const b64 = u8 => { let s = ''; u8.forEach(c => { s += String.fromCharCode(c); }); return btoa(s); };
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const Vault = {
  key: null,
  async derive(pass, salt) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: 250000, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  },
  async enc(obj) { const iv = crypto.getRandomValues(new Uint8Array(12)); const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, this.key, new TextEncoder().encode(JSON.stringify(obj))); return { iv: b64(iv), ct: b64(new Uint8Array(ct)) }; },
  async dec(e) { const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(e.iv) }, this.key, unb64(e.ct)); return JSON.parse(new TextDecoder().decode(pt)); },
};
const POS_KEYS = ['lat', 'lng', 'acc', 'alt'];
const pick = (o, keys) => Object.fromEntries(keys.filter(k => o[k] !== undefined && o[k] !== null).map(k => [k, o[k]]));
const omit = (o, keys) => Object.fromEntries(Object.entries(o).filter(([k]) => !keys.includes(k)));
async function pack(rec) {
  if (!Vault.key) return rec;
  const payload = hasPos(rec) ? pick(rec, POS_KEYS) : {};
  const op = (rec.obs || []).map((o, i) => hasPos(o) ? { i, ...pick(o, POS_KEYS) } : null).filter(Boolean);
  if (op.length) payload.obs = op;
  if (!Object.keys(payload).length) return rec;
  const out = omit(rec, POS_KEYS);
  if (out.obs) out.obs = out.obs.map(o => omit(o, POS_KEYS));
  out.enc = await Vault.enc(payload);
  return out;
}
async function unpack(rec) {
  if (!rec || !rec.enc) return rec;
  const { enc, ...rest } = rec;
  if (!Vault.key) return rest;
  try {
    const { obs: op, ...top } = await Vault.dec(enc);
    const out = { ...rest, ...top };
    if (op && out.obs) { out.obs = out.obs.map(o => ({ ...o })); op.forEach(({ i, ...p }) => { if (out.obs[i]) Object.assign(out.obs[i], p); }); }
    return out;
  } catch { return rest; }
}

const S = {

const STORE_OF = { spot: 'spots', sortie: 'sorties', specimen: 'specimens' };
async function saveRec(kind, rec) {
  const store = STORE_OF[kind];
  rec.updatedAt = new Date().toISOString(); rec.createdAt = rec.createdAt || rec.updatedAt;
  const list = S[store]; const i = list.findIndex(x => x.id === rec.id);
  if (i >= 0) list[i] = rec; else list.push(rec);
  try { await DB.put(store, await pack(rec)); } catch (e) { toast("Enregistrement impossible : l'espace de stockage est indisponible."); throw e; }
  return rec;
}
function photosOfRec(rec) {
  const out = [...(rec?.photoIds || []), ...Object.values(rec?.photos || {}), ...(rec?.extra || [])];
  (rec?.obs || []).forEach(o => out.push(...Object.values(o.photos || {})));
  return out.filter(Boolean);
}
async function deleteRec(kind, id) {
  const store = STORE_OF[kind];
  const rec = S[store].find(x => x.id === id);
  S[store] = S[store].filter(x => x.id !== id);
  await DB.del(store, id).catch(() => {});
  for (const p of photosOfRec(rec)) await DB.del('photos', p).catch(() => {});
}
const metaPut = (id, value) => DB.put('meta', { id, value }).catch(() => {});
const saveSettings = () => metaPut('settings', S.settings);
async function loadAll() {
  const [sp, so, sm, meta] = await Promise.all(['spots', 'sorties', 'specimens', 'meta'].map(s => DB.all(s).catch(() => [])));
  S.spots = await Promise.all(sp.map(unpack));
  S.sorties = await Promise.all(so.map(unpack));
  S.specimens = await Promise.all(sm.map(unpack));
  const m = Object.fromEntries(meta.map(x => [x.id, x.value]));
  S.settings = { mask: false, layer: 'plan', observer: '', tms: {}, mapObs: true, ...(m.settings || {}) };
  if (!LAYERS[S.settings.layer]) S.settings.layer = 'plan';
  S.climate = m.climate || null;
  S.seen = m.seen || {};
  S.taxnotes = m.taxnotes || {};
  S.backup = m.backup || null;

}

const spotById = id => S.spots.find(s => s.id === id);
const sortiesOf = spotId => S.sorties.filter(s => s.spotId === spotId).sort((a, b) => b.date.localeCompare(a.date));
const countOf = so => (so.obs || []).reduce((n, o) => n + (Number(o.count) || 0), 0);
const fruitful = so => (so.obs || []).some(o => (o.species || o.latin || '').trim());
const posOfSortie = so => hasPos(so) ? so : spotById(so.spotId);
const posOfObs = (so, o) => hasPos(o) ? o : posOfSortie(so);
function markOfSpot(spot) {
  const last = sortiesOf(spot.id)[0];
  if (!last || daysBetween(new Date(last.date), new Date()) > 300) return '';
  return fruitful(last) ? 'g' : 'o';
}
const markOfSortie = so => daysBetween(new Date(so.date), new Date()) > 300 ? '' : (fruitful(so) ? 'g' : 'o');
function nearestSpot(pos, max = 250) {
  let best = null;
  S.spots.forEach(s => { if (!hasPos(s)) return; const d = distance(pos, s); if (d <= max && (!best || d < best.d)) best = { spot: s, d }; });
  return best;
}
/** Retrouve le taxon de référence d'une observation (latin d'abord, nom français ensuite). */
function taxonOf(o) {
  return ALL_BY_LA.get(norm(o.latin)) || REF_BY_FR.get(norm(o.species)) || ALL_BY_LA.get(norm(o.species)) || null;
}
const keyOf = o => { const t = taxonOf(o); return t ? norm(t.la) : norm(o.latin || o.species); };
const nameOf = o => { const t = taxonOf(o); return t?.fr || o.species || o.latin || ''; };
function allObs() {
  const out = [];
  S.sorties.forEach(so => (so.obs || []).forEach((o, i) => { if ((o.species || o.latin || '').trim()) out.push({ so, o, i }); }));
  return out;
}
/** Index du Mycodex : ce que tu as observé, par espèce. */
function codexIndex() {
  const m = new Map();
  allObs().forEach(({ so, o, i }) => {
    const k = keyOf(o);
    const e = m.get(k) || { key: k, ref: taxonOf(o), la: o.latin || '', fr: o.species || '', first: so.date, last: so.date, n: 0, visits: 0, spots: new Set(), list: [], photo: null };
    e.n += Number(o.count) || 0; e.visits++; e.spots.add(so.spotId);
    if (so.date < e.first) e.first = so.date; if (so.date > e.last) e.last = so.date;
    if (!e.la && o.latin) e.la = o.latin; if (!e.fr && o.species) e.fr = o.species;
    if (!e.photo) e.photo = o.photos?.chapeau || o.photos?.pied || null;
    e.list.push({ so, o, i });
    m.set(k, e);
  });
  for (const e of m.values()) { if (!e.photo) { const so = e.list.find(x => x.so.photoIds?.length); if (so) e.photo = so.so.photoIds[0]; } e.list.sort((a, b) => b.so.date.localeCompare(a.so.date)); }
  return m;
}
function speciesHistory() {
  const m = new Map();
  allObs().forEach(({ o }) => { if (o.species) m.set(o.species.trim(), o.latin || ''); });
  REF.forEach(t => { if (!m.has(t.fr)) m.set(t.fr, t.la); });
  CH.forEach(t => { if (!m.has(t.la)) m.set(t.la, 'Charente'); });
  return m;
}
function matchLatin(name) {
  const k = norm(name);
  if (!k) return null;
  const t = REF_BY_FR.get(k) || ALL_BY_LA.get(k);
  if (t) return { fr: t.fr, la: t.la, viaLatin: ALL_BY_LA.has(k) };
  for (const { o } of allObs()) if (norm(o.species) === k && o.latin) return { fr: name.trim(), la: o.latin };

/** Ce que tu notais à la même époque les années passées, et les spots qui donnaient ce mois-ci. */

  const same = S.sorties.filter(so => { const d = new Date(so.date); return d.getFullYear() < y && Math.abs(doy(d) - today) <= 10; }).sort((a, b) => b.date.localeCompare(a.date)).slice(0, 3);

/* ---------- complétude d'une fiche d'observation ---------- */
const CHECKS = [

  ['Hôte', o => !!(o.hote || '').trim()], ['Substrat', o => (o.substrat || []).length > 0], ['Sol', o => !!o.soltype],
  ['Stade', o => (o.stade || []).length > 0], ['Répartition', o => !!o.repart],

/* ---------- rubans et titre ---------- */

/* ---------- liste de chasse de saison ---------- */
function huntList(k = 3) {
  const idx = codexIndex();
  const m = new Date().getMonth() + 1;
  const pool = REF.filter(t => t.months.includes(m) && !idx.has(norm(t.la)) && t.tox !== 'mortelle');
  if (!pool.length) return [];
  const week = Math.floor((Date.now() - new Date(new Date().getFullYear(), 0, 1)) / 6048e5);
  const start = (week * k) % pool.length;
  return Array.from({ length: Math.min(k, pool.length) }, (_, i) => pool[(start + i) % pool.length]);

/* ---------- position (et altitude quand le GPS la donne) ---------- */
function getPos(timeout = 15000) {

    if (!('geolocation' in navigator)) return res({ error: 'unsupported' });
    try {
      navigator.geolocation.getCurrentPosition(
        p => {
          const c = p.coords; const v = { lat: c.latitude, lng: c.longitude, acc: c.accuracy, at: Date.now() };
          if (typeof c.altitude === 'number' && Number.isFinite(c.altitude)) v.alt = Math.round(c.altitude);
          S.lastPos = v; res(v);
        },
        e => res({ error: e.code === 1 ? 'denied' : 'unavailable' }),
        { enableHighAccuracy: true, timeout, maximumAge: 20000 });
    } catch { res({ error: 'unavailable' }); }

}

/* ---------- météo (Open-Meteo, coordonnées arrondies à ~1 km) ---------- */
async function getJSON(url, ms = 12000) {
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), ms);
  try { const r = await fetch(url, { signal: ctl.signal }); if (!r.ok) throw new Error('http ' + r.status); return await r.json(); } finally { clearTimeout(t); }
}

  const j = await getJSON(`https://api.open-meteo.com/v1/forecast?latitude=${pos.lat.toFixed(2)}&longitude=${pos.lng.toFixed(2)}&daily=precipitation_sum,temperature_2m_max,temperature_2m_min&past_days=30&forecast_days=7&timezone=auto`);
  const d = j.daily;
  const c = { at: Date.now(), place: pos.place || 'Autour de toi', lat: +pos.lat.toFixed(2), lng: +pos.lng.toFixed(2), days: d.time.map((t, i) => ({ d: t, mm: d.precipitation_sum[i], tmax: d.temperature_2m_max[i], tmin: d.temperature_2m_min[i] })) };
  S.climate = c; metaPut('climate', c); return c;
}
async function rainBefore(pos, dateStr) {
  const end = new Date(dateStr); const start = new Date(end); start.setDate(start.getDate() - 9);
  const age = daysBetween(end, new Date()); if (age < 0) return null;
  const host = age > 80 ? 'https://archive-api.open-meteo.com/v1/archive' : 'https://api.open-meteo.com/v1/forecast';
  const j = await getJSON(`${host}?latitude=${pos.lat.toFixed(2)}&longitude=${pos.lng.toFixed(2)}&daily=precipitation_sum,temperature_2m_max,temperature_2m_min&start_date=${dayISO(start)}&end_date=${dayISO(end)}&timezone=auto`);
  const d = j.daily || {};
  const vals = (d.precipitation_sum || []).filter(v => typeof v === 'number');
  if (!vals.length) return null;
  const temps = (d.temperature_2m_max || []).map((mx, i) => typeof mx === 'number' && typeof d.temperature_2m_min?.[i] === 'number' ? (mx + d.temperature_2m_min[i]) / 2 : null).filter(v => v !== null);
  const wx = { mm: Math.round(vals.reduce((a, b) => a + b, 0) * 10) / 10, days: 10, at: Date.now(), v: 2 };
  if (temps.length) wx.t = Math.round(temps.reduce((a, b) => a + b, 0) / temps.length * 10) / 10;

}
let syncing = false;
async function syncWeather() {
  if (syncing || !navigator.onLine) return; syncing = true;
  try {
    const todo = S.sorties.filter(so => (!so.wx || so.wx.v !== 2) && !so.demo && hasPos(posOfSortie(so)) && daysBetween(new Date(so.date), new Date()) >= 0).slice(0, 8);
    for (const so of todo) { try { const wx = await rainBefore(posOfSortie(so), so.date); if (wx) { so.wx = wx; await saveRec('sortie', so); } } catch { break; } }
  } finally { syncing = false; }
}
function rainSummary(c = S.climate) {
  if (!c) return null;
  const today = dayISO(new Date()); const past = c.days.filter(x => x.d <= today);
  const sum = n => Math.round(past.slice(-n).reduce((a, x) => a + (x.mm || 0), 0) * 10) / 10;
  let lastWet = null; for (let i = past.length - 1; i >= 0; i--) if ((past[i].mm || 0) >= 5) { lastWet = past[i]; break; }
  return { r10: sum(10), r30: sum(30), lastWet, next: c.days.find(x => x.d > today && (x.mm || 0) >= 2) };
}

async function saveFile(name, blob) {

    if (dl) {

      catch (e) { const c = e && e.code; toast(c === 'declined' ? 'Enregistrement annulé.' : c === 'rejected_extension' ? "Ce format ne peut pas être enregistré depuis l'aperçu." : 'Enregistrement impossible ici.'); return false; }
    }
  }
  const file = new File([blob], name, { type: blob.type || 'application/octet-stream' });
  if (PREFERS_TOUCH && navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: name }); return true; } catch (e) { if (e && e.name === 'AbortError') return false; }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
  return true;
}

function dexCell(t, e) {

function renderDex() {

  const keep = t => { const e = idx.get(norm(t.la));
    if (f.mode === 'observées' && !e) return false; if (f.mode === 'à trouver' && e) return false; if (f.mode === 'de saison' && !t.months?.includes(m)) return false;
    if (q && !norm(t.fr).includes(q) && !norm(t.la).includes(q)) return false; return true; };
  const cmp = f.sort === 'gb' ? (a, b) => (b.gb || 0) - (a.gb || 0) || a.n - b.n : f.sort === 'az' ? (a, b) => (a.fr || a.la).localeCompare(b.fr || b.la, 'fr') : (a, b) => a.n - b.n;
  let html = GROUPS.map(([g, name]) => {
    const all = (f.list === 'charente' ? ALL : REF).filter(t => t.g === g), list = all.filter(keep).sort(cmp); if (!list.length) return '';
    const got = all.filter(t => idx.has(norm(t.la))).length, done = got === all.length;
    return `<section class="sec" style="margin-top:20px"><div class="sec-head"><h2 class="sec-title">${esc(name)}</h2>${done ? '<span class="ribbon">complet</span>' : `<span class="sec-meta" style="font-weight:600">${got} / ${all.length}</span>`}</div>
      <div class="dex">${list.map(t => dexCell(t, idx.get(norm(t.la)))).join('')}</div></section>`;
  }).join('');
  const extra = [...idx.values()].filter(e => (!e.ref || (e.ref.ext && f.list !== 'charente')) && f.mode !== 'à trouver' && f.mode !== 'de saison' && (!q || norm(e.fr).includes(q) || norm(e.la).includes(q)));
  if (extra.length) html += `<section class="sec" style="margin-top:20px"><div class="sec-head"><h2 class="sec-title">Hors liste</h2><span class="sec-meta">${extra.length}</span></div>
    <div class="dex">${extra.map(e => dexCell(e.ref ? { ...e.ref, fr: e.fr } : { n: 0, key: e.key, fr: e.fr, la: e.la || e.fr }, e)).join('')}</div>
    <p class="faint" style="font-size:12px;margin:8px 0 0">Tes observations d'espèces absentes ${f.list === 'charente' ? 'des listes' : 'de la liste de départ'}. Elles s'ajoutent ici d'elles-mêmes.</p></section>`;
  box.innerHTML = html || '<p class="muted" style="margin-top:20px">Aucune espèce ne correspond.</p>';
  hydratePhotos(box);
}

/* ----- Fiche espèce ----- */
VIEWS.taxon = ({ key }) => {
  const idx = codexIndex(); const e = idx.get(key);
  const t = ALL_BY_LA.get(key) || e?.ref || null;
  const la = t?.la || e?.la || key, fr = t?.fr || e?.fr || '';
  const m = new Date().getMonth();
  const mine = Array(12).fill(0); e?.list.forEach(x => { mine[new Date(x.so.date).getMonth()]++; });
  const hotes = new Map(), sols = new Map(), subs = new Map();
  e?.list.forEach(({ o }) => { if (o.hote) hotes.set(o.hote, (hotes.get(o.hote) || 0) + 1); if (o.soltype) sols.set(o.soltype, (sols.get(o.soltype) || 0) + 1); (o.substrat || []).forEach(s => subs.set(s, (subs.get(s) || 0) + 1)); });
  const fmtMap = mp => [...mp.entries()].sort((a, b) => b[1] - a[1]).map(([k, v]) => `${k} × ${v}`).join(' · ');

  let shift = '';

  const note = S.taxnotes[key] || '';
  const html = `${topbar(t ? `N° ${num3(t.n)} · ${GROUPS.find(g => g[0] === t.g)[1]}` : 'Hors liste')}
  <div class="card" style="height:190px;position:relative;overflow:hidden;padding:0;background:var(--sunk)">
    ${TOPO.replace('class="topo"', 'class="topo" style="left:0;right:0;height:190px"')}
    ${e?.photo ? `<button class="ph" data-act="photo" data-id="${e.photo}" style="position:absolute;inset:0;aspect-ratio:auto;height:100%;border-radius:0"><img data-photo="${e.photo}" alt="${esc(fr || la)}"></button>`
      : `<div style="position:absolute;inset:0;display:grid;place-items:center">${e ? shroom('var(--green)', 'var(--card)', 'var(--ink)', '0', 'shroom" style="width:150px;height:112px') : shroom('none', 'none', 'var(--ink-3)', '4 4', 'shroom" style="width:150px;height:112px')}</div>`}
    <div style="position:absolute;left:10px;bottom:10px;display:flex;gap:6px">${e ? `<span class="pill green">observée × ${e.visits}</span>` : '<span class="pill ghost" style="background:var(--card)">pas encore observée</span>'}${t?.tox ? toxPill(t.tox) : ''}</div>
  </div>
  <div style="padding-top:16px;display:flex;flex-direction:column;gap:4px">
    <h1 class="title la" style="font-size:34px">${esc(la)}</h1>${fr ? `<div class="sub">${esc(fr)}</div>` : ''}
  </div>
  ${e ? `<div class="stats" style="--n:4;margin-top:16px"><div><b>${e.visits}</b><span>sorties</span></div><div><b>${nf.format(e.n)}</b><span>exemplaires</span></div><div><b>${e.spots.size}</b><span>spots</span></div><div><b>${fmtDots(e.first).slice(0, 5)}</b><span>1re · ${new Date(e.first).getFullYear()}</span></div></div>` : ''}
  <section class="sec"><div class="sec-head"><h2 class="sec-title">Calendrier</h2><span class="sec-meta">mois en cours souligné</span></div>
    <div class="months">
      <span class="ml">Toi</span>${mine.map((v, i) => `<span class="${v ? 'on' : ''} ${i === m ? 'now' : ''}" title="${MONTHS[i]} : ${v}"></span>`).join('')}
      ${t?.months ? `<span class="ml">Période</span>${MONTHS_S.map((_, i) => `<span class="${t.months.includes(i + 1) ? 'ref' : ''} ${i === m ? 'now' : ''}"></span>`).join('')}` : ''}
      <span class="ml"></span>${MONTHS_S.map(l => `<span class="mm">${l}</span>`).join('')}
    </div>
    ${t?.months ? '<p class="faint" style="font-size:12px;margin:8px 0 0">Période indicative en France, à affiner avec tes propres relevés.</p>' : ''}
    ${t?.gb ? `<p class="faint mono" style="font-size:11.5px;margin:6px 0 0">Charente : ${plural(t.gb, 'mention', 'mentions')} sur GBIF</p>` : t ? '<p class="faint mono" style="font-size:11.5px;margin:6px 0 0">Aucune mention sur GBIF en Charente pour l’instant</p>' : ''}

    <div class="lines">${ph.map(r => `<div class="kv"><span>${r.y}</span><span class="mono" style="font-size:13px">1re ${fmtDayNoYear(r.first)}${r.last !== r.first ? ` · dern. ${fmtDayNoYear(r.last)}` : ''} · ${nf.format(r.n)} ex.</span></div>`).join('')}</div>
    ${shift ? `<p class="faint" style="font-size:12px;margin:8px 0 0">Première pousse ${ph[0].y} : ${shift}.</p>` : ''}</section>` : ''}
  ${st ? `<section class="sec"><div class="sec-head"><h2 class="sec-title">Conditions de tes trouvailles</h2><span class="sec-meta">${plural(st.n, 'relevé', 'relevés')}</span></div>
    <p style="margin:0"><span class="mono" style="font-size:18px;font-weight:600">${rangeTxt(st)}</span> <span class="muted">de pluie sur les 10 jours d'avant${st.tmin != null ? ` · ${nf.format(st.tmin)} à ${nf.format(st.tmax)} °C en moyenne` : ''}</span></p>

    <div class="lines">${[['Milieu', fmtMap(forests)], ['Hôte', fmtMap(hotes)], ['Substrat', fmtMap(subs)], ['Sol', fmtMap(sols)], ['Altitude', alts.length ? (Math.min(...alts) === Math.max(...alts) ? `${Math.round(alts[0])} m` : `${Math.round(Math.min(...alts))} à ${Math.round(Math.max(...alts))} m`) : '']].filter(r => r[1]).map(([k, v]) => `<div class="kv"><span>${k}</span><span>${esc(v)}</span></div>`).join('')}</div></section>` : ''}

};

/* ----- Rubans ----- */
VIEWS.rubans = () => {
  const p = progress(), rk = rankOf(p.full);
  const html = `${topbar('Rubans de terrain')}
  <div class="rank" style="margin-top:6px">
    <span class="kicker">Titre de terrain · niveau ${rk.level} / ${RANKS.length}</span>

    ${rk.next ? `<div class="tapebar"><i style="width:${Math.min(100, rk.next.pct)}%"></i></div><div class="mono" style="font-size:12px;color:var(--ink-2)">${p.full} / ${rk.next.need} relevés complets pour devenir ${esc(rk.next.name)}</div>` : '<div class="mono" style="font-size:12px">Titre le plus haut atteint.</div>'}
    <p class="muted" style="margin:0;font-size:13px">Le titre progresse avec tes relevés complets : une fiche avec ses cinq plans, la sporée, les mesures et l'habitat.</p>
  </div>
  <section class="sec"><div class="sec-head"><h2 class="sec-title">Rubans</h2><span class="sec-meta">${RIBBONS.filter(([, , , f, g]) => f(p) >= g).length} / ${RIBBONS.length}</span></div>
    <div class="ribbons">${RIBBONS.map(([id, t, d, f, goal]) => { const v = f(p), ok = v >= goal; return `<div class="rb ${ok ? '' : 'no'}">
      ${ok ? `<span class="ribbon" style="align-self:flex-start">${esc(t)}</span>` : `<span class="rb-t">${esc(t)}</span>`}
      <span class="rb-d">${esc(d)}</span>
      ${ok ? `<span class="mono faint" style="font-size:11px">${S.seen[id] ? 'gagné le ' + fmtDots(S.seen[id]) : 'gagné'}</span>` : `<div class="gauge"><i style="width:${Math.min(100, v / goal * 100)}%"></i></div><span class="mono faint" style="font-size:11px">${Math.min(v, goal)} / ${goal}</span>`}
    </div>`; }).join('')}</div></section>
  <p class="faint" style="font-size:12px;margin:18px 0 0">Aucun ruban ne récompense la quantité ramassée ou les espèces rares : seulement l'effort et la rigueur du relevé.</p>`;

/* ----- Fiche spot ----- */
VIEWS.spot = ({ id }) => {
  const sp = spotById(id); if (!sp) return VIEWS.carnet();
  const so = sortiesOf(id), n = so.reduce((a, s) => a + countOf(s), 0), frs = so.filter(fruitful);
  const months = Array(12).fill(0); frs.forEach(s => { months[new Date(s.date).getMonth()]++; });
  const sps = new Map(); so.forEach(s => (s.obs || []).forEach(o => { if (!o.species && !o.latin) return; const k = keyOf(o); const e = sps.get(k) || { key: k, name: nameOf(o), la: taxonOf(o)?.la || o.latin, n: 0 }; e.n += Number(o.count) || 0; sps.set(k, e); }));
  const sf = rainStats(frs), sb = rainStats(so.filter(s => !fruitful(s)));
  const cur = S.spotwx[id];
  const html = `${topbar('Spot', `<button class="icon-btn" data-act="go" data-v="spotForm" data-id="${id}" aria-label="Modifier le spot">${I.edit}</button>`)}
  <div style="display:flex;flex-direction:column;gap:4px;padding-top:4px"><span class="kicker">${esc(sp.forest || 'milieu non précisé')}</span><h1 class="title">${esc(sp.name)}</h1>
    <span class="mono faint" style="font-size:12px">${hasPos(sp) ? esc(fmtCoords(sp)) : 'sans position'}${hasAlt(sp) ? ` · alt. ${Math.round(sp.alt)} m` : ''}${S.lastPos && hasPos(sp) ? ` · à ${fmtDist(distance(S.lastPos, sp))}` : ''}</span></div>
  <div class="stats" style="--n:3;margin-top:14px"><div><b>${so.length}</b><span>sorties</span></div><div><b>${nf.format(n)}</b><span>exemplaires</span></div><div><b>${so.length ? Math.round(frs.length / so.length * 100) : 0} %</b><span>fructueuses</span></div></div>
  <div class="btn-row" style="margin-top:14px"><button class="btn ink" data-act="newSortie" data-id="${id}">Noter une sortie</button>${hasPos(sp) ? `<button class="btn" data-act="go" data-v="retrouver" data-id="${id}">${I.compass} Retrouver</button>` : ''}</div>
  ${sp.notes ? `<section class="sec"><p style="margin:0;font-size:15px;line-height:1.5;white-space:pre-wrap">${esc(sp.notes)}</p></section>` : ''}
  ${sf || sb ? `<section class="sec"><div class="sec-head"><h2 class="sec-title">Tes repères ici</h2><span class="sec-meta">pluie sur 10 jours</span></div>
    <div class="lines">
      ${sf ? `<div class="kv"><span>Fructueuses</span><span><span class="mono" style="display:block">${rangeTxt(sf)}</span><span class="faint" style="display:block;font-size:12px">médiane ${nf.format(sf.med)} mm · ${plural(sf.n, 'sortie', 'sorties')}</span>${rangeBar(sf, cur?.mm)}</span></div>` : ''}
      ${sb ? `<div class="kv"><span>Blanches</span><span><span class="mono" style="display:block">${rangeTxt(sb)}</span><span class="faint" style="display:block;font-size:12px">${plural(sb.n, 'sortie', 'sorties')}</span></span></div>` : ''}
      <div class="kv"><span>En ce moment</span><span class="mono" id="spot-now" style="font-size:13px">${cur ? `${nf.format(cur.mm)} mm${typeof cur.t === 'number' ? ` · ${nf.format(cur.t)} °C` : ''} <span class="faint">· ${ago(new Date(cur.at).toISOString())}</span>` : navigator.onLine && !IN_CLAUDE ? 'relevé en cours…' : 'pas de réseau'}</span></div>
    </div><p class="faint" style="font-size:12px;margin:8px 0 0">Pluie des 10 jours avant chacune de tes sorties ici. Tes chiffres, pas une prévision.</p></section>` : ''}
  <section class="sec"><div class="sec-head"><h2 class="sec-title">Calendrier du spot</h2><span class="sec-meta">sorties fructueuses</span></div>
    <div class="months"><span class="ml">Sorties</span>${months.map((v, i) => `<span class="${v ? 'on' : ''}" style="${v ? `opacity:${0.35 + 0.65 * v / Math.max(...months)}` : ''}" title="${MONTHS[i]} : ${v}"></span>`).join('')}<span class="ml"></span>${MONTHS_S.map(l => `<span class="mm">${l}</span>`).join('')}</div></section>
  ${sps.size ? `<section class="sec"><div class="sec-head"><h2 class="sec-title">Espèces ici</h2><span class="sec-meta">${sps.size}</span></div>
    <div class="lines">${[...sps.values()].sort((a, b) => b.n - a.n).map(e => `<button class="li" data-act="taxon" data-key="${esc(e.key)}"><span class="grow" style="font-size:14px">${esc(e.name)} ${e.la && e.la !== e.name ? `<span class="la muted">${esc(e.la)}</span>` : ''}</span><span class="mono" style="font-size:12px">${e.n} ex.</span></button>`).join('')}</div></section>` : ''}
  <section class="sec"><div class="sec-head"><h2 class="sec-title">Sorties</h2></div>${so.length ? `<div class="lines">${so.map(s => sortieLine(s, false)).join('')}</div>` : '<p class="muted">Aucune sortie notée ici pour le moment.</p>'}</section>`;
  return {
    html,
    async mount() {
      if (!(sf || sb) || (cur && Date.now() - cur.at < 3 * 3600e3)) return;
      const r = await spotRainNow(sp);
      if (S.view === 'spot' && S.params.id === id && r && r !== cur) render();
      else if (!r) { const el = $('#spot-now'); if (el && S.params.id === id) el.textContent = 'pas de réseau'; }
    },
  };
};

/* ----- Formulaire spot ----- */
VIEWS.spotForm = ({ id, here }) => {
  const ex = id ? spotById(id) : null;
  if (!S.draft || S.draft.kind !== 'spot' || S.draft.id !== (id || null)) {
    const p = freshPos();
    S.draft = ex ? { kind: 'spot', ...structuredClone(ex) } : { kind: 'spot', id: null, name: '', forest: '', notes: '', ...(p ? posFields(p) : {}) };
  }
  const d = S.draft;
  const html = `${topbar(ex ? 'Modifier le spot' : 'Nouveau spot')}
  <div class="stack" style="margin-top:6px">
    <div class="field"><label class="label" for="f-name">Nom du spot</label><input class="in" id="f-name" data-bind="name" value="${esc(d.name)}" placeholder="Chênaie du Puits-Rond" autocomplete="off"></div>
    <div class="field"><label class="label" for="f-forest">Milieu</label><select class="in" id="f-forest" data-bind="forest"><option value="">Non précisé</option>${FOREST.map(f => `<option ${d.forest === f ? 'selected' : ''}>${f}</option>`).join('')}</select></div>
    <div class="field"><span class="label">Position</span>
      <div id="pick" class="map map-pick"><div class="cross"><span></span></div><div class="map-ctl"><button type="button" data-act="pickHere" aria-label="Ma position">${I.locate}</button><button type="button" data-act="cycleLayer" aria-label="Changer de fond de carte">${I.layers}</button></div></div>
      <div class="mono faint" id="pick-coords" style="font-size:12px">${hasPos(d) ? `viseur : ${d.lat.toFixed(5)}, ${d.lng.toFixed(5)}${d.acc ? ` · GPS ±${Math.round(d.acc)} m` : ''}${hasAlt(d) ? ` · alt. ${Math.round(d.alt)} m` : ''}` : 'Fais glisser la carte pour placer le viseur, ou utilise ta position.'}</div>
      <details><summary>Saisir les coordonnées</summary><div class="row" style="margin-top:6px"><input class="in num" id="f-lat" inputmode="decimal" placeholder="Latitude" value="${hasPos(d) ? d.lat.toFixed(6) : ''}"><input class="in num" id="f-lng" inputmode="decimal" placeholder="Longitude" value="${hasPos(d) ? d.lng.toFixed(6) : ''}"><button class="btn" data-act="pickManual">OK</button></div></details>
    </div>
    <div class="field"><label class="label" for="f-notes">Notes sur le milieu</label><textarea class="in" id="f-notes" data-bind="notes" placeholder="Exposition, sol, essences, repères pour retrouver le coin…">${esc(d.notes)}</textarea></div>
    <button class="btn ink big block" data-act="saveSpot">${ex ? 'Enregistrer' : 'Créer le spot'}</button>
    ${ex ? `<button class="btn danger block" data-act="delSpot" data-id="${ex.id}">${I.trash} Supprimer ce spot</button>` : ''}
  </div>`;
  let map;
  return {
    html,
    mount() {
      const c = hasPos(d) ? d : S.lastPos || S.spots.find(hasPos) || { lat: 45.65, lng: 0.16 };
      map = new SlipMap($('#pick'), { center: c, zoom: hasPos(d) ? 16 : 12, layer: S.settings.layer, onMove: p => { d.lat = p.lat; d.lng = p.lng; d.acc = null; delete d.alt; const el = $('#pick-coords'); if (el) el.textContent = `viseur : ${p.lat.toFixed(5)}, ${p.lng.toFixed(5)}`; } });
      S.pickMap = map; if (here && !hasPos(d)) ACT.pickHere();
    },
    unmount() { map?.destroy(); S.pickMap = null; },
  };
};

/* ----- Formulaire sortie (saisie rapide) ----- */

  }
